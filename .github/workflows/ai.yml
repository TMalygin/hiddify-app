name: AI validation and builds

on:
  push:
    branches: [ai]
  pull_request:
    branches: [ai]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHANNEL: prod
  FLUTTER_VERSION: '3.38.5'
  GOMAXPROCS: '4'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    # Flutter tests load the runner's SQLite. 3.37.2 on 22.04 rejects
    # ADD COLUMN ... CHECK with DQS disabled (SQLite upstream bug, #23).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install regression test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin
          python3 -m pip install PyYAML==6.0.3
      - name: Packaging and CI regression tests
        run: |
          python3 -m unittest discover -s test/packaging -p 'test_*.py' -v
          python3 -m unittest discover -s test/ci -p 'test_*.py' -v
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare generated sources
        run: make common-prepare
      - name: Analyze and test
        run: |
          python3 -c 'import sqlite3; print("Runner SQLite:", sqlite3.sqlite_version)'
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

  build:
    needs: [checks]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: android
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          # The action defaults to the removed legacy SDK package "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          packages=$(sed 's/#.*//' linux_deps.list | xargs)
          sudo apt-get install -y $packages libfuse2
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          printf '%s  %s\n' ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 "$RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          dart pub global activate fastforge 0.6.12
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Build and verify pinned fork core
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$BUILD_PLATFORM" = android ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          python3 scripts/build_ai_core.py "$BUILD_PLATFORM"
          mkdir -p artifacts
          cp build/ai-core/CORE_SOURCE.json artifacts/
      - name: Verify Linux CLI loading outside the bundle
        if: matrix.platform == 'linux'
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source = json.loads(Path('build/ai-core/CORE_SOURCE.json').read_text())
          cli = Path('hiddify-core/bin/HiddifyCli').resolve()
          result = subprocess.run([str(cli), 'admin_bgservice', 'build-id'],
                                  cwd=os.environ['RUNNER_TEMP'], capture_output=True, text=True, check=True)
          assert result.stdout.strip() == source['commit'], result.stdout
          PY
      - name: Prepare generated sources
        run: make common-prepare
      - name: Build AppImage
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: make linux-appimage-release
      - name: Build Android APK
        if: matrix.platform == 'android'
        # Without a private keystore this is signed with the build's debug key.
        run: flutter build apk --release --target lib/main_prod.dart --target-platform android-arm64
      - name: Android native regression tests (API 36)
        if: matrix.platform == 'android'
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -Ptarget=lib/main_prod.dart --no-daemon
      - name: Collect artifacts and checksums
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p artifacts
          if [ "$BUILD_PLATFORM" = linux ]; then
            cp dist/*/*.AppImage artifacts/
            cp dist/*/*.tar.gz artifacts/
          else
            python3 scripts/collect_android_artifact.py
          fi
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          (cd artifacts && sha256sum -- * > SHA256SUMS)
      - name: Upload ai artifacts
        if: github.ref == 'refs/heads/ai'
        uses: actions/upload-artifact@v6
        with:
          name: hiddify-ai-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
