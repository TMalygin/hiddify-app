syntax = "proto3";
package appimage_smoke;

// The public wire contract is independent of the core bundled in the image under test.
message SandboxRunRequest {
  repeated string command = 1;
  string application_id = 2;
  string executable_root = 3;
  bool chromium_sandbox = 4;
}

message SandboxEvent {
  enum State { OFFLINE = 0; ONLINE = 1; ERROR = 2; EXITED = 3; OUTPUT = 4; }
  State state = 1;
  uint64 revision = 2;
  bytes stdout = 3;
  bytes stderr = 4;
  int32 exit_code = 5;
  string message = 6;
}
